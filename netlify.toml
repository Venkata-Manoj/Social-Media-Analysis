# Netlify config — SocialPulse DSA0606
# Deploy either the repo root OR the web/ folder. This file lives in web/
# but Netlify will also find it if you publish from the root (copy to ../netlify.toml).
# Keeping paths relative so file:// still works locally.

[build]
  # No build step needed — zero-build static. If you use web/dist, set publish = "web/dist"
  # For root publish (recommended: keeps single-file canonical):
  publish = "../"
  # For web/ isolated publish (after `npm run sync`):
  # publish = "dist"
  command = "echo 'Static — no build required. If using dist, run: npm run sync'"

[build.environment]
  NODE_VERSION = "18"

# ---- SPA fallback — serve index.html for all non-file routes ----
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["visitor"] }
  # Netlify's SPA redirect needs force = false so real files are served first
  force = false

# ---- Headers: security + caching + CORS ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/data/*.csv"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/csv; charset=utf-8"

[[headers]]
  for = "/web/seo.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Optional: custom 404 (falls back to index.html via redirect above) ----
# To use a real 404 page instead of SPA fallback, create web/public/404.html and change the final redirect to:
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404
