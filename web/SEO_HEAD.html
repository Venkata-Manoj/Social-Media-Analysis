<!-- Optional runtime SEO loader (file:// safe: fetches ./web/seo.json if present) -->
<script>
(function(){
  // Only runs if seo.json is reachable (http/https). No-op on file:// without server.
  var u = 'web/seo.json';
  try {
    fetch(u).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if(!j || !j.site) return;
      // ensure canonical points to current origin when deployed
      var can = document.querySelector('link[rel=canonical]');
      if(can && location.protocol.startsWith('http')) {
        can.href = location.origin + location.pathname.replace(/index\.html$/,'');
      }
    }).catch(function(){});
  } catch(e) {}
})();
</script>
