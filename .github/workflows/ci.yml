name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.20"
      - name: Lint with ruff
        run: ruff check
      - name: Format check with ruff
        run: ruff format --check

  test:
    name: Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install python-docx==1.2.0 matplotlib==3.11.1 pillow==12.2.0
      - name: Run Python tests (26 tests, 420 posts)
        run: python3 tests/test_app.py
      - name: Run JS dashboard logic tests (13 tests)
        run: node tests/test_dashboard_logic.js
      - name: Validate CSV/JSON parity + index.html embed
        run: python3 scripts/validate_data.py --verbose

  validate:
    name: Validate project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check key files exist
        run: |
          errors=0
          for f in README.md index.html pyproject.toml data/social_media_dataset.json data/social_media_dataset.csv data/dataset_stats.json assets/fig1_sentiment.png; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ $f missing"; errors=$((errors+1)); fi
          done
          # Optional report (tracked but not required for CI gate)
          if [ -f "report/Assignment6_Social_Media_Sentiment_Engagement_Report.docx" ]; then echo "✅ report docx"; else echo "⚠️ report docx missing (optional)"; fi
          exit $errors
      - name: Check Python syntax
        run: |
          errors=0
          for py in data/generate_dataset.py report/generate_report.py scripts/validate_data.py tests/test_app.py src/build_app.py web/server.py; do
            if python -c "compile(open('$py').read(), '$py', 'exec')" 2>/dev/null; then echo "✅ $py"; else echo "❌ $py syntax error"; errors=$((errors+1)); fi
          done
          exit $errors
      - name: Verify single-file app embeds 420 posts
        run: |
          count=$(python3 -c "import re,json; m=re.search(r'const RAW_DATA\s*=\s*(\[.*?\]);', open('index.html').read(), re.S); print(len(json.loads(m.group(1))) if m else 0)")
          echo "RAW_DATA posts: $count"
          if [ "$count" -eq 420 ]; then echo "✅ index.html embeds 420"; else echo "❌ embed count $count"; exit 1; fi
